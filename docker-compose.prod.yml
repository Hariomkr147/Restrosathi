version: '3.8'

services:
  app:
    build: .
    restart: always
    env_file:
      - .env.production
    environment:
      - UPLOAD_DIR=/app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_started

  postgres:
    image: postgres:17
    restart: always
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: restrosathi
    volumes:
      - pgdata:/var/lib/postgresql/data

  caddy:
    image: caddy:2
    restart: always
    env_file:
      - .env.production
    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    restart: always
    env_file:
      - .env.production
    volumes:
      - ./scripts/backup-db.sh:/usr/local/bin/backup-db.sh
      - backups:/backups
      - uploads:/app/uploads
      - wa-akg-pgdata:/wa-akg-data
    environment:
      - BACKUP_PATHS=/app/uploads,/wa-akg-data
    entrypoint: >
      /bin/sh -c "chmod +x /usr/local/bin/backup-db.sh && while true; do
        sleep \$(( \$(date -d '03:00 tomorrow' +%s) - \$(date +%s) ));
        /usr/local/bin/backup-db.sh || true;
        npx tsx scripts/backup/run.ts || true;
      done"
    depends_on:
      postgres:
        condition: service_started

  cron:
    image: node:22-alpine
    restart: always
    user: "node"
    env_file:
      - .env.production
    entrypoint: >
      /bin/sh -c "while true; do
        node -e \"
          const h = { 'Authorization': 'Bearer ' + process.env.CRON_SECRET };
          Promise.allSettled([
            fetch('http://app:3000/api/cron/outbox', { headers: h }),
            fetch('http://app:3000/api/cron/reminders', { headers: h }),
            fetch('http://app:3000/api/cron/escalations', { method: 'POST', headers: h }),
            fetch('http://app:3000/api/cron/alerts', { headers: h })
          ]).catch(() => {});
        \";
        sleep 10;
      done"
    depends_on:
      - app

  cron-daily:
    image: node:22-alpine
    restart: always
    user: "node"
    env_file:
      - .env.production
    entrypoint: >
      /bin/sh -c "while true; do
        node -e \"fetch('http://app:3000/api/cron/retention', { method: 'POST', headers: { 'Authorization': 'Bearer ' + process.env.CRON_SECRET } }).catch(()=>{})\";
        sleep 86400;
      done"
    depends_on:
      - app

  wa-akg-db:
    image: postgres:17
    restart: always
    profiles: ["whatsapp"]
    environment:
      POSTGRES_USER: waakg
      POSTGRES_PASSWORD: waakg_password
      POSTGRES_DB: waakg
    volumes:
      - wa-akg-pgdata:/var/lib/postgresql/data

  wa-akg:
    build:
      context: https://github.com/mrifqidaffaaditya/WA-AKG.git#f4b0ad01b0b9777265a39cbfa0e8e93be78f35f2
    restart: always
    profiles: ["whatsapp"]
    environment:
      DATABASE_URL: "postgresql://waakg:waakg_password@wa-akg-db:5432/waakg"
      AUTH_SECRET: ${WA_WEBHOOK_SECRET:-default_auth_secret_override_me}
    depends_on:
      wa-akg-db:
        condition: service_started

volumes:
  uploads:
  pgdata:
  caddy_data:
  caddy_config:
  backups:
  wa-akg-pgdata:


