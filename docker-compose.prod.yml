version: '3.8'

services:
  app:
    build: .
    restart: always
    env_file:
      - .env.production
    environment:
      - UPLOAD_DIR=/app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_started

  postgres:
    image: postgres:17
    restart: always
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: restrosathi
    volumes:
      - pgdata:/var/lib/postgresql/data

  caddy:
    image: caddy:2
    restart: always
    env_file:
      - .env.production
    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  backup:
    image: postgres:17
    restart: always
    env_file:
      - .env.production

    volumes:
      - ./scripts/backup-db.sh:/usr/local/bin/backup-db.sh
      - backups:/backups
    entrypoint: >
      /bin/sh -c "chmod +x /usr/local/bin/backup-db.sh && while true; do
        sleep \$(( \$(date -d '03:00 tomorrow' +%s) - \$(date +%s) ));
        /usr/local/bin/backup-db.sh;
      done"
    depends_on:
      postgres:
        condition: service_started

  cron:
    image: curlimages/curl
    restart: always
    env_file:
      - .env.production
    entrypoint: >
      /bin/sh -c "while true; do
        curl -sf http://app:3000/api/cron/outbox -H \"Authorization: Bearer $${CRON_SECRET}\" || true;
        curl -sf http://app:3000/api/cron/health -H \"Authorization: Bearer $${CRON_SECRET}\" || true;
        curl -sf http://app:3000/api/cron/reminders -H \"Authorization: Bearer $${CRON_SECRET}\" || true;
        curl -X POST -sf http://app:3000/api/cron/escalations -H \"Authorization: Bearer $${CRON_SECRET}\" || true;
        sleep 10;
      done"
    depends_on:
      - app

  cron-daily:
    image: curlimages/curl
    restart: always
    env_file:
      - .env.production
    entrypoint: >
      /bin/sh -c "while true; do
        curl -X POST -sf http://app:3000/api/cron/retention -H \"Authorization: Bearer $${CRON_SECRET}\" || true;
        sleep 86400;
      done"
    depends_on:
      - app

  wa-akg-db:
    image: postgres:17
    restart: always
    profiles: ["whatsapp"]
    environment:
      POSTGRES_USER: waakg
      POSTGRES_PASSWORD: waakg_password
      POSTGRES_DB: waakg
    volumes:
      - wa-akg-pgdata:/var/lib/postgresql/data

  wa-akg:
    build:
      context: https://github.com/mrifqidaffaaditya/WA-AKG.git#f4b0ad01b0b9777265a39cbfa0e8e93be78f35f2
    restart: always
    profiles: ["whatsapp"]
    environment:
      DATABASE_URL: "postgresql://waakg:waakg_password@wa-akg-db:5432/waakg"
      AUTH_SECRET: ${WA_WEBHOOK_SECRET:-default_auth_secret_override_me}
    depends_on:
      wa-akg-db:
        condition: service_started

volumes:
  uploads:
  pgdata:
  caddy_data:
  caddy_config:
  backups:
  wa-akg-pgdata:


