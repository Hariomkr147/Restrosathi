name: CI

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: restrosathi
          POSTGRES_PASSWORD: restrosathi
          POSTGRES_DB: restrosathi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U restrosathi -d restrosathi"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://restrosathi:restrosathi@127.0.0.1:5432/restrosathi?schema=public
      TEST_DATABASE_URL: postgresql://restrosathi:restrosathi@127.0.0.1:5432/restrosathi_test?schema=public
      SEED_OWNER_PASSWORD: DemoOwner!2026
      SEED_STAFF_PIN: "123456"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: PGPASSWORD=restrosathi psql -h localhost -U restrosathi -d restrosathi -f docker/postgres-init.sql
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:int
      - name: E2E in the fixed browser environment
        run: |
          docker run --rm --network host --ipc host \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/work" \
            --mount "type=bind,source=$(dirname "$(dirname "$(command -v node)")"),target=/opt/node22,readonly" \
            --workdir /work --env HOME=/tmp \
            --env "PATH=/opt/node22/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            --env CI --env DATABASE_URL --env TEST_DATABASE_URL \
            --env SEED_OWNER_PASSWORD --env SEED_STAFF_PIN \
            mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 \
            npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
