name: CI

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: restrosathi
          POSTGRES_PASSWORD: restrosathi
          POSTGRES_DB: restrosathi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U restrosathi -d restrosathi"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://restrosathi:restrosathi@localhost:5432/restrosathi?schema=public
      TEST_DATABASE_URL: postgresql://restrosathi:restrosathi@localhost:5432/restrosathi_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: PGPASSWORD=restrosathi psql -h localhost -U restrosathi -d restrosathi -f docker/postgres-init.sql
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:int
      - run: npm run test:e2e
