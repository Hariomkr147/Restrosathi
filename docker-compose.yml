services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: restrosathi
      POSTGRES_PASSWORD: restrosathi
      POSTGRES_DB: restrosathi
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restrosathi -d restrosathi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
